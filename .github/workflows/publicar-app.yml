# Publica la carpeta app/ en GitHub Pages cada vez que cambia en main.
name: Publicar app
on:
  push:
    branches: [main]
    paths: ['desarrollo/app/**', '.github/workflows/publicar-app.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desarrollo/app
      - id: deploy
        uses: actions/deploy-pages@v4
